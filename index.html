<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RidePool</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ── Auth Screen ───────────────────────────────────────────────────── -->
<div id="screen-auth" class="screen active">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-mark">
        <svg viewBox="0 0 80 70" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- White car body -->
          <path fill="white" d="M16 0L64 0C75.2 0 80 14 80 30.1L80 56C80 65.1 76 70 68.8 70L49.6 70C44.8 63.7 35.2 63.7 30.4 70L11.2 70C4 70 0 65.1 0 56L0 30.1C0 14 4.8 0 16 0Z"/>
          <!-- Windshield cutout -->
          <path fill="#141416" d="M26.4 2.1L53.6 2.1C57.6 2.1 61.6 6.1 61.6 10.1L61.6 18.6C61.6 22.6 57.6 26.6 53.6 26.6L26.4 26.6C22.4 26.6 18.4 22.6 18.4 18.6L18.4 10.1C18.4 6.1 22.4 2.1 26.4 2.1Z"/>
          <!-- Left headlight -->
          <path fill="#141416" d="M3.36 39.2C7.41 32.2 18.45 34.44 21.76 39.2C18.45 43.96 7.41 46.2 3.36 39.2Z"/>
          <!-- Right headlight -->
          <path fill="#141416" d="M76.64 39.2C72.59 32.2 61.55 34.44 58.24 39.2C61.55 43.96 72.59 46.2 76.64 39.2Z"/>
        </svg>
      </div>
    </div>
    <h1 class="auth-title">RidePool</h1>
    <p class="auth-subtitle">School carpooling, made simple.</p>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchAuthTab('signin')">Sign In</button>
      <button class="auth-tab" onclick="switchAuthTab('signup')">Create Account</button>
    </div>

    <!-- Sign In Form -->
    <form id="form-signin" class="auth-form" onsubmit="handleSignIn(event)">
      <div class="field-group">
        <label>School Email</label>
        <input type="email" id="si-email" placeholder="you@school.edu" required />
      </div>
      <div class="field-group">
        <label>Password</label>
        <input type="password" id="si-password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-primary" id="btn-signin">Sign In</button>
    </form>

    <!-- Sign Up Form -->
    <form id="form-signup" class="auth-form hidden" onsubmit="handleSignUp(event)">
      <div class="field-group">
        <label>Full Name</label>
        <input type="text" id="su-name" placeholder="Your Name" required />
      </div>
      <div class="field-group">
        <label>School Email</label>
        <input type="email" id="su-email" placeholder="you@school.edu" required />
      </div>
      <div class="field-group">
        <label>Password</label>
        <input type="password" id="su-password" placeholder="At least 6 characters" required />
      </div>
      <div class="field-group">
        <label>School</label>
        <input type="text" id="su-school" placeholder="Redmond High School" required />
      </div>
      <div class="field-group">
        <label>Year</label>
        <select id="su-year" required>
          <option value="">Select your year</option>
          <option>Freshman</option><option>Sophomore</option>
          <option>Junior</option><option>Senior</option>
          <option>Graduate Student</option><option>Faculty / Staff</option>
        </select>
      </div>
      <div class="field-group">
        <label>Role</label>
        <div class="role-picker" id="role-picker">
          <button type="button" class="role-btn active" data-role="student" onclick="selectRole(this)">
            <span class="role-icon">🎓</span>
            <div>
              <div class="role-name">Student</div>
              <div class="role-sub">Attend events and request rides</div>
            </div>
          </button>
          <button type="button" class="role-btn" data-role="staff" onclick="selectRole(this)">
            <span class="role-icon">🔑</span>
            <div>
              <div class="role-name">Staff / Faculty</div>
              <div class="role-sub">Post events and oversee the platform</div>
            </div>
          </button>
          <button type="button" class="role-btn" data-role="studentRep" onclick="selectRole(this)">
            <span class="role-icon">⭐</span>
            <div>
              <div class="role-name">Student Rep / Club Organizer</div>
              <div class="role-sub">Post events on behalf of your club</div>
            </div>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="btn-signup">Create Account</button>
    </form>

    <!-- Divider -->
    <div class="auth-divider"><span>or</span></div>

    <!-- Google Sign In -->
    <button class="btn-google" onclick="handleGoogleSignIn()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/><path d="M3.964 10.707A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.961L3.964 6.293C4.672 4.166 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
      Continue with Google
    </button>

    <div id="auth-error" class="auth-error hidden"></div>
  </div>
</div>

<!-- ── Onboarding Screen ───────────────────────────────────────────────── -->
<div id="screen-onboarding" class="screen hidden">
  <div class="auth-card">
    <h1 class="auth-title" style="margin-top:24px">Almost there!</h1>
    <p class="auth-subtitle">Tell us about yourself to complete your profile.</p>
    <form class="auth-form" onsubmit="handleOnboarding(event)">
      <div class="field-group">
        <label>School</label>
        <input type="text" id="ob-school" placeholder="Redmond High School" required />
      </div>
      <div class="field-group">
        <label>Year</label>
        <select id="ob-year" required>
          <option value="">Select your year</option>
          <option>Freshman</option><option>Sophomore</option>
          <option>Junior</option><option>Senior</option>
          <option>Graduate Student</option><option>Faculty / Staff</option>
        </select>
      </div>
      <div class="field-group">
        <label>Role</label>
        <div class="role-picker" id="ob-role-picker">
          <button type="button" class="role-btn active" data-role="student" onclick="selectObRole(this)">
            <span class="role-icon">🎓</span>
            <div><div class="role-name">Student</div><div class="role-sub">Attend events and request rides</div></div>
          </button>
          <button type="button" class="role-btn" data-role="staff" onclick="selectObRole(this)">
            <span class="role-icon">🔑</span>
            <div><div class="role-name">Staff / Faculty</div><div class="role-sub">Post events and oversee the platform</div></div>
          </button>
          <button type="button" class="role-btn" data-role="studentRep" onclick="selectObRole(this)">
            <span class="role-icon">⭐</span>
            <div><div class="role-name">Student Rep / Club Organizer</div><div class="role-sub">Post events on behalf of your club</div></div>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primary">Get Started</button>
    </form>
  </div>
</div>

<!-- ── Main App ───────────────────────────────────────────────────────── -->
<div id="screen-app" class="screen hidden">

  <!-- Sidebar (desktop) -->
  <aside id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-mark">
        <svg viewBox="0 0 80 70" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:22px;height:19px">
          <path fill="white" d="M16 0L64 0C75.2 0 80 14 80 30.1L80 56C80 65.1 76 70 68.8 70L49.6 70C44.8 63.7 35.2 63.7 30.4 70L11.2 70C4 70 0 65.1 0 56L0 30.1C0 14 4.8 0 16 0Z"/>
          <path fill="#141416" d="M26.4 2.1L53.6 2.1C57.6 2.1 61.6 6.1 61.6 10.1L61.6 18.6C61.6 22.6 57.6 26.6 53.6 26.6L26.4 26.6C22.4 26.6 18.4 22.6 18.4 18.6L18.4 10.1C18.4 6.1 22.4 2.1 26.4 2.1Z"/>
          <path fill="#141416" d="M3.36 39.2C7.41 32.2 18.45 34.44 21.76 39.2C18.45 43.96 7.41 46.2 3.36 39.2Z"/>
          <path fill="#141416" d="M76.64 39.2C72.59 32.2 61.55 34.44 58.24 39.2C61.55 43.96 72.59 46.2 76.64 39.2Z"/>
        </svg>
      </div>
      <span>RidePool</span>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-view="home" onclick="navigate('home')">
        <span class="nav-icon">🏠</span> Home
      </button>
      <button class="nav-item" data-view="rides" onclick="navigate('rides')">
        <span class="nav-icon">🚗</span> My Rides
      </button>
      <button class="nav-item" data-view="notifications" onclick="navigate('notifications')">
        <span class="nav-icon">🔔</span> Notifications
        <span id="notif-badge" class="badge hidden">0</span>
      </button>
      <button class="nav-item" data-view="shop" onclick="navigate('shop')">
        <span class="nav-icon">🛍</span> Shop
      </button>
      <button class="nav-item" data-view="profile" onclick="navigate('profile')">
        <span class="nav-icon">👤</span> Profile
      </button>
    </nav>
  </aside>

  <!-- Content -->
  <main id="content">
    <div id="view-home" class="view active"></div>
    <div id="view-event" class="view hidden"></div>
    <div id="view-create" class="view hidden"></div>
    <div id="view-rides" class="view hidden"></div>
    <div id="view-notifications" class="view hidden"></div>
    <div id="view-shop" class="view hidden"></div>
    <div id="view-profile" class="view hidden"></div>
  </main>

  <!-- Bottom nav (mobile) -->
  <nav id="bottom-nav">
    <button class="bnav-item active" data-view="home" onclick="navigate('home')">
      <span>🏠</span><span>Home</span>
    </button>
    <button class="bnav-item" data-view="rides" onclick="navigate('rides')">
      <span>🚗</span><span>Rides</span>
    </button>
    <button class="bnav-item" data-view="notifications" onclick="navigate('notifications')">
      <span>🔔</span><span>Alerts</span>
      <span id="bnav-badge" class="bnav-badge hidden">0</span>
    </button>
    <button class="bnav-item" data-view="shop" onclick="navigate('shop')">
      <span>🛍</span><span>Shop</span>
    </button>
    <button class="bnav-item" data-view="profile" onclick="navigate('profile')">
      <span>👤</span><span>Profile</span>
    </button>
  </nav>
</div>

<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<!-- Firebase SDKs (CDN — works locally and on Hosting) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<!-- On Firebase Hosting: auto-injects config. Silently skipped locally. -->
<script src="/__/firebase/init.js" onerror=""></script>
<!-- Local dev fallback: gitignored firebase-config.js initialises Firebase if not yet done.
     Create this file locally — it is never committed. See web/SETUP.md. -->
<script src="firebase-config.js" onerror=""></script>
<script src="app.js"></script>
</body>
</html>
